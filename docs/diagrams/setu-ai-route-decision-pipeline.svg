    <g stroke="none" font-size="23">
      <text x="170" y="178" text-anchor="middle" font-size="30" font-weight="700">1. SENSE</text>
      <text x="170" y="220">• Incident</text><text x="170" y="254">• Weather</text><text x="170" y="288">• Road</text><text x="170" y="322">• Delay</text>
      <text x="460" y="178" text-anchor="middle" font-size="30" font-weight="700">2. ASSESS</text>

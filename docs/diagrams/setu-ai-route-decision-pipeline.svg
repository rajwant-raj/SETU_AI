      <text x="750" y="178" text-anchor="middle" font-size="30" font-weight="700">3. GENERATE</text>
      <text x="750" y="220">• Feasible alternatives</text><text x="750" y="254">• ETA / delay</text>
      <text x="1040" y="178" text-anchor="middle" font-size="30" font-weight="700">4. SCORE &amp; RANK</text>
      <text x="1040" y="220">• ETA • Risk • Access</text><text x="1040" y="254">• Distance • Vehicle fit</text><text x="1040" y="306" font-size="24">Normalize → Score → Rank</text>
      <text x="1330" y="178" text-anchor="middle" font-size="30" font-weight="700">5. ADVISE</text>
      <text x="1330" y="220">• ML disruption</text><text x="1330" y="254">  advisory</text><text x="1330" y="288">• Trade-offs</text>
